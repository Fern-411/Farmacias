server:
  port: 8080

spring:
  application:
    name: siip-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:siipdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

siip:
  geosearch:
    max-radius-km: 10.0
    max-results: 5
  prediction:
    horizon-days: 7
    expiration-threshold-days: 90
